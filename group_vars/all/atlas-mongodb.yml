# atlas-mongodb — variable catalog for standalone runs
# Secrets: group_vars/all/atlas-mongodb.secrets.yml

mongodb_hosts: mongo_cluster

cluster_domain: mongodb.example.com
cluster_workspace_id: "{{ lookup('ansible.builtin.env', 'CLUSTER_WORKSPACE_ID') | default(cluster_domain, true) }}"
cluster_workspace_parent: ./workspace
cluster_workspace_root: "{{ cluster_workspace_parent }}/{{ cluster_workspace_id }}"

ansible_user: localuser

# Package line. Ubuntu 26.04 and Debian 13 publish the server only for 9.0.
mongodb_version: "9.0"
mongodb_replset_name: atlas
mongodb_port: 27017
mongodb_admin_user: admin
mongodb_data_dir: /var/lib/mongodb
mongodb_keyfile_path: /etc/mongodb/keyfile
mongodb_secret_pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{7,}$"
